name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: pam
          POSTGRES_PASSWORD: pam
          POSTGRES_DB: pam_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pam" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pam:pam@localhost:5432/pam_test
      DATABASE_URL: postgresql+psycopg://pam:pam@localhost:5432/pam_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check app tests
      - run: uv run pytest -q
      - name: Dataset is reproducible (CSV, JSON and SQL)
        run: uv run python -m app.cli repro --scale starter --report /tmp/repro.json
      - name: Committed starter dataset is exactly what the generator produces
        run: |
          uv run python -m app.cli generate --scale starter --out /tmp/starter
          uv run python -m app.cli export --scale starter --out /tmp/starter
          for p in inputs ground_truth json; do diff -r /tmp/starter/$p ../data/starter/$p; done
          diff /tmp/starter/manifest.json ../data/starter/manifest.json
          diff /tmp/starter/seed.sql ../data/starter/seed.sql
      - name: Published manifest hashes match the committed manifests
        working-directory: .
        run: sha256sum -c docs/manifest-hashes.sha256

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Audit shipped dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npx vitest run

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos

  deploy:
    # Continuous delivery: only after every job above passes, only for pushes to main.
    needs: [backend, web, mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: SSH setup
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          printf 'Host vbs\n  HostName %s\n  User ubuntu\n  IdentityFile ~/.ssh/deploy_key\n  StrictHostKeyChecking yes\n' \
            "${{ secrets.DEPLOY_HOST }}" > ~/.ssh/config
      - name: Backend (alembic, restart, readiness check, rollback on failure)
        run: bash deploy/deploy.sh vbs
      - name: Web console
        working-directory: web
        env:
          # Public Firebase web identifiers (not secrets), same as web/.env.example documents.
          VITE_FIREBASE_API_KEY: AIzaSyCKQevQumG5aLD1GWpKjCI--0c96qjc7WU
          VITE_FIREBASE_AUTH_DOMAIN: payment-account-manager.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: payment-account-manager
        run: |
          npm ci && npm run build
          tar czf - -C dist . | ssh vbs "sudo tar xzf - -C /opt/pam/www --overwrite"
