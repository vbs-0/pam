<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F7F9FC" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>PAM · Payment Account Manager</title>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading PAM">
        <picture><source media="(prefers-color-scheme: dark)" srcset="/logo-dark.png" /><img src="/logo-light.png" width="72" height="72" alt="" /></picture>
        <p>PAM</p><span class="bar"></span>
      </div>
      <style>
        body { margin: 0; background: #F7F9FC; }
        .boot { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; font: 700 14px/1 system-ui, sans-serif; letter-spacing: .2em; color: #1E3A8A; }
        .boot img { animation: bootpulse 1.4s ease-in-out infinite; }
        .boot p { margin: 4px 0 0; }
        .boot .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(30,58,138,.15); position: relative; overflow: hidden; }
        .boot .bar::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 40%; background: #1E3A8A; border-radius: 3px; animation: bootslide 1.1s ease-in-out infinite; }
        @keyframes bootpulse { 50% { transform: scale(1.08); opacity: .8; } }
        @keyframes bootslide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        @media (prefers-color-scheme: dark) { body { background: #0e1420; } .boot { color: #9db4f5; } .boot .bar { background: rgba(157,180,245,.18); } .boot .bar::after { background: #9db4f5; } }
        @media (prefers-reduced-motion: reduce) { .boot img, .boot .bar::after { animation: none; } }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
