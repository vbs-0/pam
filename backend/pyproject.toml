[project]
name = "pam"
version = "0.1.0"
description = "PAM — Payment Account Manager: categorize transactions, map recurring payments, compare spend vs budgets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.14",
  "pydantic-settings>=2.6",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "tzdata>=2024.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["db: needs PostgreSQL via TEST_DATABASE_URL", "slow: full-scale runs"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E741", "B008"]  # B008: FastAPI Depends() defaults are idiomatic

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]  # rendered operations; long CHECK expressions
"app/api/analytics.py" = ["E501"]  # long SQL strings
"app/api/entries_plus.py" = ["E501"]
"app/api/me_plus.py" = ["E501"]
"app/households.py" = ["E501"]
"tests/**" = ["E501"]  # long literal payloads read better on one line
